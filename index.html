function genId(){ return Math.random().toString(36).substr(2,8); }
const fmt = n => "₹"+Math.round(n).toLocaleString("en-IN");

const CURRENCIES=[

function getCurr(code){ return CURRENCIES.find(c=>c.code===code)||CURRENCIES[0]; }
function fmtC(n,code){ const c=getCurr(code); return c.symbol+Math.round(n).toLocaleString("en-IN"); }
function cg(id){ return (COVERS.find(c=>c.id===id)||COVERS[0]).g; }
function coverBg(trip){
  if(trip.coverPhoto) return {backgroundImage:`url(${trip.coverPhoto})`,backgroundSize:"cover",backgroundPosition:"center"};
  return {background:cg(trip.cover)};
}
function CoverDiv({trip,style={},children}){
  if(trip.coverPhoto) return <div style={{...style,backgroundImage:`url(${trip.coverPhoto})`,backgroundSize:"cover",backgroundPosition:"center"}}>{children}</div>;

}

function Av({name,photo,list=[],size=36,border="none"}){

}

/* ── Custom Category Dropdown ── */
function CatSelect({value,onChange,options,icons,style={}}){
  const T=useT();
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const handler=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);
  const icon=icons[value];
  return(
    <div ref={ref} style={{position:"relative",...style}}>
      <div onClick={()=>setOpen(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"rgba(255,255,255,0.07)",border:`1px solid ${open?T.accent:T.border}`,borderRadius:10,cursor:"pointer",userSelect:"none"}}>
        {icon&&<span style={{display:"flex",alignItems:"center",color:T.accent,flexShrink:0}}>{icon}</span>}
        <span style={{flex:1,fontSize:14,color:T.text,fontWeight:500}}>{value.replace(/^[\p{Emoji}\s]+/u,"").trim()}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style={{transform:open?"rotate(180deg)":"none",transition:"transform 0.2s",flexShrink:0}}><path d="M6 9l6 6 6-6" stroke={T.textSub} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:T.surface,border:`1px solid ${T.border2}`,borderRadius:12,zIndex:500,overflowY:"auto",maxHeight:280,boxShadow:"0 8px 24px rgba(0,0,0,0.35)"}}>
        {options.map(opt=>{
          const ic=icons[opt];
          const isSelected=opt===value;
          return(
            <div key={opt} onClick={()=>{onChange(opt);setOpen(false);}} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",background:isSelected?"rgba(255,221,87,0.1)":"transparent",cursor:"pointer",borderBottom:`1px solid ${T.border}`}}>
              {ic&&<span style={{display:"flex",alignItems:"center",color:isSelected?T.accent:T.textSub,flexShrink:0}}>{ic}</span>}
              <span style={{fontSize:14,fontWeight:isSelected?700:400,color:isSelected?T.accent:T.text}}>{opt.replace(/^[\p{Emoji}\s]+/u,"").trim()}</span>
              {isSelected&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{marginLeft:"auto"}}><path d="M20 6L9 17l-5-5" stroke={T.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

function SignIn({onDone}){
  const T=useT();
  const [step,setStep]=useState("main");
  const [phone,setPhone]=useState("");
  const [otp,setOtp]=useState(["","","","","",""]);
  const [fOtp]=useState(()=>String(100000+Math.floor(Math.random()*900000)));
  const [sending,setSending]=useState(false);
  const refs=useRef([]);
  const inp={padding:"13px 14px",background:"rgba(255,255,255,0.07)",border:`1px solid ${T.border}`,borderRadius:12,color:T.text,fontSize:15,outline:"none",fontFamily:T.fontBody,width:"100%",boxSizing:"border-box"};
  const sendOtp=()=>{ if(phone.length<10)return; setSending(true); setTimeout(()=>{setSending(false);setStep("otp");},1000); };
  const onOC=(i,v)=>{ if(!/^\d*$/.test(v))return; const n=[...otp]; n[i]=v.slice(-1); setOtp(n); if(v&&i<5)refs.current[i+1]?.focus(); };
  const onOK=(i,e)=>{ if(e.key==="Backspace"&&!otp[i]&&i>0)refs.current[i-1]?.focus(); };
  const verify=()=>{ if(otp.join("").length<6)return; setTimeout(()=>onDone({phone}),500); };

      </div>
      <YBtn onClick={sendOtp} disabled={phone.length<10||sending}>{sending?"Sending…":"Send OTP"}</YBtn>
    </div></Scr>
  );

    <Scr><div style={{padding:"52px 24px 0"}}>
      <button onClick={()=>setStep("phone")} style={{background:"none",border:"none",color:T.textSub,cursor:"pointer",marginBottom:24,padding:0,fontSize:14}}>← Back</button>

      </div>
      <YBtn onClick={verify} disabled={otp.join("").length<6}>Verify & Continue →</YBtn>
    </div></Scr>
  );
}

/* ── Create Trip ── */
function CreateTrip({user,onDone,onBack}){
  const T=useT();
  const [step,setStep]=useState(1);
  const [tn,setTn]=useState(""); const [dest,setDest]=useState(""); const [sd,setSd]=useState(""); const [ed,setEd]=useState(""); const [cov,setCov]=useState(COVERS[0].id); const [coverPhoto,setCoverPhoto]=useState(null); const [coverLoaded,setCoverLoaded]=useState(false); const [curr,setCurr]=useState("INR");
  const coverRef=useRef(null);
  const [friends,setFriends]=useState([user.name]); const [nf,setNf]=useState(""); const [fe,setFe]=useState("");
  const today=new Date().toISOString().split("T")[0];
  const inp={padding:"13px 14px",background:"rgba(255,255,255,0.07)",border:`1px solid ${T.border}`,borderRadius:12,color:T.text,fontSize:15,outline:"none",fontFamily:T.fontBody,width:"100%",boxSizing:"border-box"};
  const addF=()=>{ const n=nf.trim(); if(!n)return; if(friends.includes(n)){setFe("Already added");return;} if(friends.length>=10){setFe("Max 10");return;} setFriends(p=>[...p,n]); setNf(""); setFe(""); };
  const create=()=>{ const trip={id:genId(),tripName:tn.trim(),destination:dest.trim(),startDate:sd,endDate:ed,cover:cov,coverPhoto:coverPhoto||null,currency:curr,friends,expenses:[],itinerary:[],vault:[],notes:[],memberPhotos:{[user.name]:user.photo||null},createdAt:Date.now()}; const all=[...loadTrips(),trip]; saveTrips(all); onDone(trip); };
  const onCoverFile=e=>{ const f=e.target.files[0]; e.target.value=""; if(!f)return; if(f.size>5*1024*1024){return;} const rd=new FileReader(); rd.onload=ev=>{ setCoverPhoto(ev.target.result); setCoverLoaded(false); }; rd.readAsDataURL(f); };
  if(step===1) return(
    <Scr><div style={{padding:"0 24px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,paddingTop:52,marginBottom:22}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:T.textSub,fontSize:20,cursor:"pointer",padding:0,lineHeight:1}}>←</button>
        <div><div style={{fontFamily:T.fontHead,fontSize:20,fontWeight:900,color:T.text,letterSpacing:-1}}>NEW TRIP</div><div style={{fontSize:13,color:T.textSub}}>Step 1 of 2</div></div>
      </div>
      <div style={{height:3,background:"rgba(255,255,255,0.08)",borderRadius:2,marginBottom:22}}><div style={{width:"50%",height:"100%",background:T.accent,borderRadius:2}}/></div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div><div style={{fontSize:12,fontWeight:600,color:T.textSub,marginBottom:6}}>TRIP NAME *</div><input style={inp} placeholder="e.g. Goa 2025" value={tn} onChange={e=>setTn(e.target.value)}/></div>
        <div><div style={{fontSize:12,fontWeight:600,color:T.textSub,marginBottom:6}}>DESTINATION *</div><input style={inp} placeholder="e.g. Goa, Manali" value={dest} onChange={e=>setDest(e.target.value)}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div><div style={{fontSize:12,fontWeight:600,color:T.textSub,marginBottom:6}}>START *</div><input style={inp} type="date" value={sd} onChange={e=>setSd(e.target.value)} min={today}/></div>
          <div><div style={{fontSize:12,fontWeight:600,color:T.textSub,marginBottom:6}}>END *</div><input style={inp} type="date" value={ed} onChange={e=>setEd(e.target.value)} min={sd||today}/></div>
        </div>
        <div>
          <div style={{fontSize:12,fontWeight:600,color:T.textSub,marginBottom:8}}>COVER PHOTO</div>
          <input ref={coverRef} type="file" accept="image/*" style={{display:"none"}} onChange={onCoverFile}/>
          {coverPhoto
            ?<div style={{position:"relative",borderRadius:14,overflow:"hidden",marginBottom:10,height:120}}>

function VaultPdf({src,name}){
  const T=useT();
  const openPdf=()=>{
    try{
      const b64=src.split(",")[1];
      const bytes=atob(b64);
      const arr=new Uint8Array(bytes.length);
      for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
      const blob=new Blob([arr],{type:"application/pdf"});
      const url=URL.createObjectURL(blob);
      window.open(url,"_blank");
    }catch(e){ alert("Could not open PDF."); }
  };
  return(
    <div style={{width:"100%",borderRadius:14,overflow:"hidden",background:"#111",border:"1px solid rgba(255,255,255,0.1)"}}>

function simplifyDebts(bal){
  const cr=[],db=[];
  Object.entries(bal).forEach(([n,b])=>{ if(b>0.5)cr.push({n,a:b}); else if(b<-0.5)db.push({n,a:-b}); });
  cr.sort((a,b)=>b.a-a.a); db.sort((a,b)=>b.a-a.a);
  const t=[]; let i=0,j=0;
  while(i<cr.length&&j<db.length){ const a=Math.min(cr[i].a,db[j].a); t.push({from:db[j].n,to:cr[i].n,amount:a}); cr[i].a-=a; db[j].a-=a; if(cr[i].a<0.5)i++; if(db[j].a<0.5)j++; }
  return t;
}

      {sae&&<div style={{position:"fixed",inset:0,zIndex:200}}>
        <div onClick={()=>{setSae(false);setEeid(null);setAm("");setDs("");setReceipt(null);}} style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.75)"}}/>
        <div style={{position:"absolute",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",background:T.surface,borderRadius:"18px 18px 0 0",padding:"16px 16px 32px"}}>
          <div style={{width:32,height:4,background:T.border2,borderRadius:2,margin:"0 auto 14px"}}/>
          <div style={{fontFamily:T.fontHead,fontSize:15,fontWeight:900,color:T.text,marginBottom:12}}>{eeid?"EDIT EXPENSE":"ADD EXPENSE"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>WHO PAID?</div><select style={{...inp,fontSize:13}} value={py} onChange={e=>setPy(e.target.value)}>{trip.friends.map(f=><option key={f}>{f}</option>)}</select></div>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>AMOUNT (₹)</div><input style={{...inp,fontSize:13}} type="number" min="0" value={am} onChange={e=>setAm(e.target.value)} placeholder="0"/></div>
          </div>
          <div style={{marginBottom:8}}><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>DESCRIPTION</div><input style={inp} placeholder="Beach lunch…" value={ds} onChange={e=>setDs(e.target.value)}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>CATEGORY</div><CatSelect value={ec} onChange={setEc} options={EC} icons={EC_ICONS}/></div>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>DATE</div><input style={{...inp,fontSize:13}} type="date" value={ed2} onChange={e=>setEd2(e.target.value)}/></div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:6}}>SPLIT AMONG {sp.length>0&&amN>0&&<span style={{color:T.accentText}}>· {getCurr(cc).symbol}{Math.round(amN/sp.length).toLocaleString("en-IN")} each</span>}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{trip.friends.map(f=>{ const on=sp.includes(f); const c=pc(f,trip.friends); return <div key={f} onClick={()=>tsp(f)} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"5px 10px",borderRadius:99,fontSize:12,cursor:"pointer",fontWeight:on?700:500,background:on?c.bg:"rgba(255,255,255,0.05)",color:on?c.tx:T.textSub,border:`1.5px solid ${on?c.bg:T.border}`}}>{on&&"✓ "}{f}</div>; })}</div>
          </div>
          <input ref={receiptRef} type="file" accept="image/*" style={{display:"none"}} onChange={onReceiptFile}/>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:6}}>RECEIPT PHOTO <span style={{fontWeight:400,color:T.textMuted}}>(optional)</span></div>
            {receipt
              ?<div style={{position:"relative",borderRadius:10,overflow:"hidden",height:90}}>
                <img src={receipt} alt="receipt" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <button onClick={()=>receiptRef.current?.click()} style={{padding:"5px 10px",background:"rgba(255,255,255,0.9)",border:"none",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer",color:"#000"}}>Change</button>
                  <button onClick={()=>setReceipt(null)} style={{padding:"5px 10px",background:"rgba(0,0,0,0.5)",border:"1px solid rgba(255,255,255,0.3)",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer",color:"#fff"}}>Remove</button>
                </div>
              </div>
              :<div onClick={()=>receiptRef.current?.click()} style={{height:52,border:`1.5px dashed ${T.border2}`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8,cursor:"pointer",background:T.surface2}}>
                <span style={{fontSize:16}}>🧾</span>
                <span style={{fontSize:12,color:T.textSub,fontWeight:600}}>Attach Receipt</span>
              </div>
            }
          </div>
          <YBtn onClick={saveE} disabled={!py||!am||!ds.trim()||sp.length===0}>{eeid?"Save Changes":"Add Expense"}</YBtn>
        </div>
      </div>}
      {sai&&<div style={{position:"fixed",inset:0,zIndex:200}}>
        <div onClick={()=>setSai(false)} style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.75)"}}/>
        <div style={{position:"absolute",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",background:T.surface,borderRadius:"18px 18px 0 0",padding:"16px 16px 32px"}}>
          <div style={{width:32,height:4,background:T.border2,borderRadius:2,margin:"0 auto 12px"}}/>
          <div style={{fontFamily:T.fontHead,fontSize:15,fontWeight:900,color:T.text,marginBottom:12}}>{eid?"EDIT ITEM":"ADD TO DAY"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>TIME</div><input style={{...inp,fontSize:13}} type="time" value={it} onChange={e=>setIt(e.target.value)}/></div>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>CATEGORY</div><CatSelect value={ic} onChange={setIc} options={IC} icons={IC_ICONS}/></div>
          </div>
          <div style={{marginBottom:8}}><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>TITLE *</div><input style={inp} placeholder="e.g. Fly to Goa" value={ii} onChange={e=>setIi(e.target.value)}/></div>
          <div style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>NOTES</div><textarea style={{...inp,resize:"none",height:60}} placeholder="Flight no, address…" value={iD} onChange={e=>setID(e.target.value)}/></div>
          <YBtn onClick={saveI} disabled={!ii.trim()}>{eid?"Save Changes":"Add to Itinerary"}</YBtn>
        </div>
      </div>}
      {sad&&<div style={{position:"fixed",inset:0,zIndex:200}}>
        <div onClick={()=>setSad(false)} style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.75)"}}/>
        <div style={{position:"absolute",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",background:T.surface,borderRadius:"18px 18px 0 0",padding:"16px 16px 32px",maxHeight:"88vh",overflowY:"auto"}}>
          <div style={{width:32,height:4,background:T.border2,borderRadius:2,margin:"0 auto 12px"}}/>
          <div style={{fontFamily:T.fontHead,fontSize:15,fontWeight:900,color:T.text,marginBottom:12}}>{edid?"EDIT DOCUMENT":"ADD DOCUMENT"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>NAME *</div><input style={{...inp,fontSize:13}} placeholder="e.g. Aadhar" value={dn} onChange={e=>setDn(e.target.value)}/></div>
            <div><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>CATEGORY</div><CatSelect value={dc} onChange={setDc} options={VC} icons={VC_ICONS}/></div>
          </div>
          <div style={{marginBottom:8}}><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>NOTES / DETAILS</div><textarea style={{...inp,resize:"none",height:68}} placeholder="PNR, booking ID…" value={dco} onChange={e=>setDco(e.target.value)}/></div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:6}}>ATTACH FILE (max 4MB)</div>
            {dfn&&<div style={{fontSize:12,color:T.accent,marginBottom:6}}>📎 {dfn}</div>}
            <label style={{display:"block",padding:"11px",background:"rgba(255,255,255,0.04)",border:`1.5px dashed ${T.border2}`,borderRadius:10,textAlign:"center",cursor:"pointer",color:T.textSub,fontSize:13}}>
              {dfn?"Replace file":"📁 Tap to upload"}
              <input type="file" accept="image/*,.pdf" style={{display:"none"}} onChange={onDf}/>
            </label>
          </div>
          <YBtn onClick={saveD} disabled={!dn.trim()}>{edid?"Save Changes":"Add to Vault"}</YBtn>
        </div>
      </div>}
      {confirmDel&&<div style={{position:"fixed",inset:0,zIndex:500,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
        <div style={{background:T.surface,borderRadius:18,padding:"24px 20px",width:"100%",maxWidth:320,boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
          <div style={{width:52,height:52,borderRadius:14,background:"rgba(248,113,113,0.15)",border:"1px solid rgba(248,113,113,0.3)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="#f87171" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M10 11v5M14 11v5" stroke="#f87171" strokeWidth="2" strokeLinecap="round"/></svg>
          </div>
          <div style={{fontFamily:T.fontHead,fontSize:18,fontWeight:900,color:T.text,textAlign:"center",marginBottom:8}}>Delete Trip?</div>
          <div style={{fontSize:13,color:T.textSub,textAlign:"center",lineHeight:1.5,marginBottom:24}}>All expenses, itinerary, vault documents and notes will be permanently deleted.</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <button onClick={deleteTrip} style={{width:"100%",padding:"13px",background:"#ef4444",border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>Yes, Delete Trip</button>
            <button onClick={()=>setConfirmDel(false)} style={{width:"100%",padding:"13px",background:T.surface2,border:`1px solid ${T.border}`,borderRadius:12,color:T.text,fontSize:15,fontWeight:600,cursor:"pointer"}}>Cancel</button>
          </div>
        </div>
      </div>}
      {viewReceipt&&<div style={{position:"fixed",inset:0,zIndex:400,background:"rgba(0,0,0,0.97)",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 16px",borderBottom:`1px solid ${T.border}`}}>
          <button onClick={()=>setViewReceipt(null)} style={{background:"none",border:"none",color:T.textSub,fontSize:18,cursor:"pointer",padding:0,lineHeight:1}}>←</button>
          <div style={{fontSize:14,fontWeight:700,color:T.text}}>Receipt</div>
          <div style={{width:28}}/>
        </div>
        <div style={{flex:1,overflow:"auto",padding:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <img src={viewReceipt} alt="receipt" style={{maxWidth:"100%",maxHeight:"80vh",borderRadius:12,objectFit:"contain"}}/>
        </div>
      </div>}
      {vd&&<div style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.96)",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",borderBottom:`1px solid ${T.border}`}}>
          <button onClick={()=>setVd(null)} style={{background:"none",border:"none",color:T.textSub,fontSize:18,cursor:"pointer",padding:0,lineHeight:1}}>←</button>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:T.text}}>{vd.name}</div><div style={{fontSize:11,color:T.textSub}}>{vd.category} · by {vd.addedBy}</div></div>
        </div>
        <div style={{flex:1,overflow:"auto",padding:16}}>
          {vd.content&&<div style={{background:T.surface2,borderRadius:10,padding:"11px 13px",marginBottom:12,border:`1px solid ${T.border}`}}><div style={{fontSize:11,fontWeight:600,color:T.textSub,marginBottom:4}}>NOTES</div><div style={{fontSize:14,color:T.text,lineHeight:1.6,wordBreak:"break-all"}}>{vd.content}</div></div>}
          {vd.file&&(vd.fileName&&vd.fileName.toLowerCase().endsWith(".pdf")
            ?<VaultPdf src={vd.file} name={vd.name}/>
            :<VaultImg src={vd.file} alt={vd.name}/>
          )}
          {!vd.file&&!vd.content&&<div style={{textAlign:"center",color:T.textSub,fontSize:14,marginTop:40}}>No content stored</div>}
        </div>
      </div>}
    </div>
  );
}

/* ── Root ── */
function App(){
  const [scr,setScr]=useState("splash");
  const [user,setUser]=useState(null);
  const [trips,setTrips]=useState([]);
  const [cs,setCs]=useState(0);
  const [at,setAt]=useState(null);
  const [dark,setDark]=useState(()=>{ try{ return localStorage.getItem("ts_dark")!=="false"; }catch(e){ return true; } });
  const theme=getT(dark);
  const toggleTheme=()=>{ const nd=!dark; setDark(nd); try{ localStorage.setItem("ts_dark",String(nd)); }catch(e){} };

  useEffect(()=>{
    // Inject fonts
    const link = document.createElement('link');
    link.rel='stylesheet';
    link.href='https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Barlow+Condensed:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap';
    document.head.appendChild(link);
    // Inject CSS
    const style = document.createElement('style');
    style.textContent = `
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      body{background:#000;}
      input,select,textarea,button{font-family:'DM Sans',sans-serif;}
      input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
      ::placeholder{color:rgba(255,255,255,0.25);}
      ::-webkit-scrollbar{width:0;}
      @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes scaleIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
      .fade-up{animation:fadeUp 0.55s cubic-bezier(.22,1,.36,1) both}
      .fade-in{animation:fadeIn 0.45s ease both}
      .scale-in{animation:scaleIn 0.4s cubic-bezier(.34,1.56,.64,1) both}
      .btn-press:active{transform:scale(0.97);transition:transform 0.1s;}
      .tag-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;transition:all 0.18s;}
      .tag-chip.active{background:#fff;color:#000;border-color:#fff;font-weight:600;}
      .tag-chip .remove{font-size:14px;color:rgba(0,0,0,0.5);cursor:pointer;}
    `;
    document.head.appendChild(style);
    return ()=>{ try{document.head.removeChild(link);document.head.removeChild(style);}catch(e){} };
  }, []);

  useEffect(()=>{ const u=loadUser(); if(u?.name)setUser(u); setTrips(loadTrips()); },[]);
  const go=t=>{ setAt(t); setScr("dash"); };
  const splashDone=()=>{ const u=loadUser(); if(u?.name){setUser(u);setTrips(loadTrips());setScr("home");}else setScr("signin"); };
  const signIn=()=>setScr("profile");
  const profile=d=>{ setUser(d); saveUser(d); setScr("home"); };
  const openTrip=t=>{ const all=loadTrips(); go(all.find(x=>x.id===t.id)||t); };
  const tripCreated=t=>{ setAt(t); setCs(3); };
  const goToTrip=()=>{ setCs(0); go(at); };
  const backHome=()=>{ setAt(null); setTrips(loadTrips()); setScr("home"); };
  const updUser=u=>{ setUser(u); saveUser(u); };

  return(
    <ThemeCtx.Provider value={theme}>
      <div style={{background:theme.bg,minHeight:"100vh",transition:"background 0.3s"}}>
        {scr==="splash"&&<Splash onDone={splashDone}/>}
        {scr==="signin"&&<SignIn onDone={signIn}/>}
        {scr==="profile"&&<ProfileSetup onDone={profile}/>}
        {scr==="home"&&user&&cs===0&&<Home user={user} trips={trips} onCreate={()=>setCs(1)} onOpen={openTrip} onUpdateUser={updUser} toggleTheme={toggleTheme} dark={dark}/>}
        {scr==="home"&&user&&cs===1&&<CreateTrip user={user} onDone={tripCreated} onBack={()=>setCs(0)}/>}
        {cs===3&&at&&<TripCreated trip={at} onGo={goToTrip}/>}
        {scr==="dash"&&at&&user&&<Dashboard trip={at} user={user} onBack={backHome} toggleTheme={toggleTheme} dark={dark}/>}
      </div>
    </ThemeCtx.Provider>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
